name: skip-live-activities
on:
  push:
    branches: [ main ]
    tags: "[0-9]+.[0-9]+.[0-9]+"
  schedule:
    - cron:  '0 8 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  call-workflow:
    uses: skiptools/actions/.github/workflows/skip-framework.yml@v1

  # The Skip workflow does not compile the iOS-only ActivityKit code or the widget views,
  # so build both targets for the iOS simulator here.
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SkipLiveActivities and SkipLiveActivitiesUI for iOS
        run: |
          xcodebuild build -scheme SkipLiveActivitiesUI \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation
